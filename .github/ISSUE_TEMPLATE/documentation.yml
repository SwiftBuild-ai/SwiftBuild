name: Documentation improvement
description: Describe missing, unclear or outdated SwiftBuild guidance.
body:
  - type: markdown
    attributes:
      value: 'Small fixes and questions are welcome. Fill in what you know; maintainers can help investigate. For private security reporting, read SECURITY.md.'
  - type: textarea
    id: problem
    attributes:
      label: Context and proposed outcome
      description: Describe missing, unclear or outdated SwiftBuild guidance.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Useful details (optional)
      description: A page link, unclear sentence, or suggested wording is helpful. You do not need to investigate the implementation or run tests to report a documentation problem. Omit private data.
    validations:
      required: false
