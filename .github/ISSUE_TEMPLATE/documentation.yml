name: Documentation improvement
description: Describe missing, unclear or outdated SwiftBuild guidance.
body:
  - type: markdown
    attributes:
      value: 'Do not report vulnerabilities here. Read SECURITY.md for private reporting prerequisites.'
  - type: textarea
    id: problem
    attributes:
      label: Context and proposed outcome
      description: Describe missing, unclear or outdated SwiftBuild guidance.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and verification
      description: Include document paths, the current implementation evidence, and the expected correction. Distinguish implemented and planned behavior. Remove private data and external brand references.
    validations:
      required: true
