name: Feature request
description: Describe a user outcome and why it matters.
body:
  - type: markdown
    attributes:
      value: 'Do not report vulnerabilities here. Read SECURITY.md for private reporting prerequisites.'
  - type: textarea
    id: problem
    attributes:
      label: Context and proposed outcome
      description: Describe a user outcome and why it matters.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Examples or extra context (optional)
      description: Share an example or the result you would like to see. A technical design or test plan is not required. Omit private data.
    validations:
      required: false
