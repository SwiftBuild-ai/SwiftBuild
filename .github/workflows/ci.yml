name: Verify
on:
  push:
    branches: [main]
  pull_request:
env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: swiftbuild_test
          POSTGRES_DB: swiftbuild_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d swiftbuild_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SWIFTBUILD_TEST_DATABASE_URL: postgresql://postgres:swiftbuild_test@127.0.0.1:5432/swiftbuild_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - name: Prepare and verify computation contracts
        run: |
          sh tooling/scripts/computation-dev.sh setup
          pnpm computation:check
          sh tooling/scripts/computation-dev.sh check
          sh tooling/scripts/computation-dev.sh test
          echo "SWIFTBUILD_COMPUTATION_PYTHON=$GITHUB_WORKSPACE/services/computation/.venv/bin/python" >> "$GITHUB_ENV"
      - run: pnpm verify
      - run: pnpm build:storybook
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm exec playwright test --config playwright.server.config.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-browser-captures
          path: test-results/**/server-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/

  docker-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and check self-hosted application
        run: |
          docker compose up --build --wait --wait-timeout 90
          curl --fail http://localhost:3000/ > /dev/null
      - name: Container diagnostics
        if: failure()
        run: docker compose logs
      - name: Engineering deployment and recovery smoke
        run: sh tooling/scripts/server-smoke.sh
      - name: Stop containers
        if: always()
        run: docker compose down
